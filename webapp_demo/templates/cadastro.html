<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Fornecedor</title>
</head>
<body>
    <h1>Cadastro de Fornecedor</h1>

    {% if mensagem %}
        <p id="mensagem-sucesso" style="color: green; font-weight: bold;">{{ mensagem }}</p>
    {% endif %}

    <form method="POST">
        <label for="nome">Nome / Razão Social:</label><br>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="cnpj">CNPJ:</label><br>
        <input type="text" id="cnpj" name="cnpj" required><br><br>

        <label for="categoria">Categoria:</label><br>
        <select id="categoria" name="categoria">
            <option value="fornecedor_geral">Fornecedor Geral</option>
            <option value="prestador_servico">Prestador de Serviço</option>
            <option value="industria">Indústria</option>
        </select><br><br>

        <button type="submit" id="btn-salvar">Salvar</button>
    </form>
</body>
</html>
